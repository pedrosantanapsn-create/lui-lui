services:
  - type: web
    name: liuelui
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_SENHA
        value: liuelui2026
      # Conexao do banco de dados ja existente na conta (patrimonio-db).
      - key: DATABASE_URL
        fromDatabase:
          name: patrimonio-db
          property: connectionString
